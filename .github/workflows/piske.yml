name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: 

      
jobs:
  build_and_package:
    name: BUILD-JOB
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    runs-on: ubuntu-slim
    

    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload findings to the Security tab


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: BUILD
        run: npm install

      - name: TEST
        run: echo "code is tested!"

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*
      - name: deploy
        run: ech0 "my code is deployed"

      - name: rollback
        if: failure()
        run: echo "rollback is done"
