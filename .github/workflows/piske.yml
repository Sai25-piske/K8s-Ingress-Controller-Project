name: Kubernetes CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  kubernetes-validation:

    name: Kubernetes Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          echo "Repository files:"
          ls -la
          echo "Kubernetes files:"
          find . -name "*.yml" -o -name "*.yaml"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes YAML
        run: |
          kubectl apply --dry-run=client -f kind-cluster.yml

      - name: Show Validation Result
        run: echo "Kubernetes YAML validation completed successfully!"
